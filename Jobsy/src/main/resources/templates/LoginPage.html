<div class="login-container">

    <div class="login-left">
        <h1>Welcome to Jobsy</h1>
        <p>
            Find your future. Build your career.
            Discover government job opportunities
            that match your qualifications and get
            notified about eligible jobs.
        </p>
    </div>

    <div class="login-right">

        <div class="logo">Jobsy</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to your Jobsy account</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                >Show</button>
            </div>

            <p id="error"></p>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="register">
            Don't have an account?
            <a href="Register.html">Register Now</a>
        </p>

    </div>
</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const button = document.querySelector(".show-password");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "Hide";
        } else {
            password.type = "password";
            button.textContent = "Show";
        }
    }

    document.getElementById("loginForm").addEventListener("submit",
        async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");

            error.textContent = "";

            try {
                const response = await fetch(
                    "http://localhost:8080/api/users/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email, password })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Invalid email or password");
                }

                if (data.token) {
                    localStorage.setItem("token", data.token);
                }

                window.location.href = "Jobs.html";

            } catch (err) {
                error.textContent =
                    err.message || "Unable to connect to server";
            }
        }
    );
</script>
